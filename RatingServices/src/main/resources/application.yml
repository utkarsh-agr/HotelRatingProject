server:
  port: 8084

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST}/${RATING_DB}?useSSL=false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: rating-service
#  config:
#    import: configserver:http://localhost:8087
  config:
    import: configserver:http://cloud-config-server-svc.default.svc.cluster.local:80
  profiles:
    active: dev

