server:
  port: 8084

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${db_username}
    password: ${db_password}
    url: ${db_url}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: rating-service
  config:
    import: configserver:http://localhost:8087
  profiles:
    active: dev

